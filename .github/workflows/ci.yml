name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        shell: bash
        run: |
          set +e
          npm run ci > ci-output.log 2>&1
          status=$?
          cat ci-output.log
          exit "$status"

      - name: Validate isolation boundaries
        run: npm run ci:isolation

      - name: Upload failed validation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ github.run_number }}
          path: ci-output.log
          if-no-files-found: error
